<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pulse | Daily Intelligence</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="background-blob"></div>
    <div class="background-blob blob-2"></div>

    <div class="app-container">
        <header class="glass-header">
            <a href="#" class="logo">
                <img src="../brandingguideline/logo.png" alt="Logo" class="logo-img"
                    onerror="this.style.display='none'">
                <span class="logo-text">AI Pulse</span>
            </a>
            <nav>
                <button class="nav-btn active" data-filter="all">All</button>
                <button class="nav-btn" data-filter="BensBytes">Ben's Bites</button>
                <button class="nav-btn" data-filter="Reddit">Reddit</button>
                <button class="nav-btn" data-filter="saved">Saved <span id="saved-count">0</span></button>
            </nav>
            <div class="actions">
                <button id="refresh-btn" class="icon-btn" title="Refresh"><i class="fa-solid fa-sync"></i></button>
            </div>
        </header>

        <main id="content-area" class="grid-layout">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </main>
    </div>

    <div id="toast" class="toast">Saved!</div>
    <script src="app.js?v=3"></script>
</body>

</html>
